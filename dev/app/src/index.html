<title>MyHifz</title>
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..800;1,400..600&family=Amiri:wght@400;700&display=swap">
<style>
/* MyHifz, bound like the Madina Mushaf. The page of the Mushaf is the only ornate thing: ivory paper, iron-gall ink,
   a gilded frame, surah cartouches and the page number in a medallion, as in print. Everything around it is set like the
   front matter of a book: Alegreya (a calligraphic book face) on paper, hairline rules, one action colour, the green of
   the binding, with gold. Lapis marks help, rubric red a word left out. At night: dark paper, parchment ink, gold. */
@font-face { font-family: "Hafs"; src: url("/*FONT_HAFS*/") format("woff2"); font-display: block; }
:root {
  --paper: #F5EEDC;
  --surface: #FBF7EC;
  --sunk: #EDE4CE;
  --ink: #201B14;
  --ink-2: #5B5142;
  --ink-3: #7D7159;
  --rule: #DDD0B2;
  /* the binding: the one colour for actions, the current place and what is learnt */
  --cobalt: #1F4E3D;
  --cobalt-ink: #1A4234;
  --cobalt-soft: #E2E9DA;
  --on-accent: #FBF5E4;
  --accent-bg: #1F4E3D;
  /* gold: illumination, what is right, what is memorised */
  --turq: #7E5F1E;
  --turq-soft: #F0E3BE;
  /* rubric red: a word left out; lapis: help */
  --tomato: #A0322B;
  --tomato-soft: #F5DFD9;
  --saffron: #2B5A85;
  --saffron-soft: #E1E8EF;
  --gold: #A8822F;
  --gold-line: #7C5C20;
  --gold-pale: #EFE1B8;
  --hide: #E9DFC6;
  --scrim: rgba(32, 27, 20, .42);
  --shadow: 0 10px 28px rgba(60, 44, 18, .16), 0 2px 6px rgba(60, 44, 18, .08);
  --tj-m2: #8457C4; --tj-m246: #6A3DB0; --tj-m45: #9A2A88; --tj-m6: #B0105C;
  --tj-gh: #1E8546; --tj-id: #5B8780; --tj-qq: #1C78AE; --tj-sl: #A89E8A;
  --font-ui: "Alegreya", "Iowan Old Style", Georgia, serif;
  --font-ar: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-q: "Hafs", "KFGQPC HAFS Uthmanic Script", "Amiri Quran", "Traditional Arabic", serif;
  --q-size: 27px;
  --r-s: 6px; --r-m: 10px; --r-l: 16px;
  --tab-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13110D; --surface: #1B1813; --sunk: #25211A; --ink: #EDE4CF; --ink-2: #BDB197; --ink-3: #8A7F69;
    --rule: #393228; --cobalt: #7DBB9A; --cobalt-ink: #A6D6BC; --cobalt-soft: #1C2D25; --on-accent: #F3EAD2; --accent-bg: #285A45;
    --turq: #D2AE5E; --turq-soft: #3A3020; --tomato: #E8908A; --tomato-soft: #3B201D; --saffron: #93B7E0; --saffron-soft: #1D2834;
    --gold: #C9A458; --gold-line: #A68643; --gold-pale: #3A311F; --hide: #2A251D;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --tj-m2: #B79AF0; --tj-m246: #A37DEE; --tj-m45: #E07BD0; --tj-m6: #FF6FA6;
    --tj-gh: #5FD08A; --tj-id: #8DBDB5; --tj-qq: #6CC2F2; --tj-sl: #6E6553;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13110D; --surface: #1B1813; --sunk: #25211A; --ink: #EDE4CF; --ink-2: #BDB197; --ink-3: #8A7F69;
  --rule: #393228; --cobalt: #7DBB9A; --cobalt-ink: #A6D6BC; --cobalt-soft: #1C2D25; --on-accent: #F3EAD2; --accent-bg: #285A45;
  --turq: #D2AE5E; --turq-soft: #3A3020; --tomato: #E8908A; --tomato-soft: #3B201D; --saffron: #93B7E0; --saffron-soft: #1D2834;
  --gold: #C9A458; --gold-line: #A68643; --gold-pale: #3A311F; --hide: #2A251D;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --tj-m2: #B79AF0; --tj-m246: #A37DEE; --tj-m45: #E07BD0; --tj-m6: #FF6FA6;
  --tj-gh: #5FD08A; --tj-id: #8DBDB5; --tj-qq: #6CC2F2; --tj-sl: #6E6553;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; overflow-x: clip; font-family: var(--font-ui); font-size: 17px; line-height: 1.45; font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.ar { font-family: var(--font-ar); direction: rtl; }
.q { font-family: var(--font-q); direction: rtl; }
.num { font-variant-numeric: lining-nums tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------ app frame */
#app { min-height: 100vh; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
.view { max-width: 42rem; margin: 0 auto; padding-inline: 18px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  margin-inline: -18px; padding: 10px 18px 8px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.topbar.scrolled { border-bottom-color: var(--rule); }
.topbar h1 { font-size: 28px; line-height: 1.1; margin: 0; font-weight: 700; flex: 1; min-width: 0; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
/* the surah switcher: the surah number in an eight-pointed star, its name, page and juz */
.title-btn { flex: 0 1 auto; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 10px; text-align: start; border: 0; background: none;
  padding: 4px 10px 4px 2px; margin-inline-start: -4px; border-radius: 10px; transition: background-color .15s; }
.title-btn:active { background: var(--sunk); }
.title-btn .tt { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.title-btn .t1 { display: flex; align-items: center; gap: 3px; min-width: 0; font-size: 19px; font-weight: 700; }
.title-btn .t1 > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title-btn .t2 { font-size: 14px; font-style: italic; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title-btn svg.chev { width: 16px; height: 16px; color: var(--ink-3); stroke-width: 2; }
.grow-space { flex: 1 1 0; min-width: 0; }
.icon-btn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 0; background: none; color: var(--ink-2); }
.icon-btn:active, .icon-btn[aria-pressed="true"] { background: var(--sunk); color: var(--ink); }
.icon-btn svg, .tab svg, .btn svg { width: 22px; height: 22px; }
/* two squares, one turned by 45 degrees: the eight-pointed star of the verse markers, drawn in gold */
.sbadge { --star: polygon(50% 0%, 64.64% 14.64%, 85.36% 14.64%, 85.36% 35.36%, 100% 50%, 85.36% 64.64%, 85.36% 85.36%, 64.64% 85.36%, 50% 100%, 35.36% 85.36%, 14.64% 85.36%, 14.64% 64.64%, 0% 50%, 14.64% 35.36%, 14.64% 14.64%, 35.36% 14.64%);
  position: relative; flex: none; width: 40px; height: 40px; display: grid; place-items: center;
  background: var(--gold); -webkit-clip-path: var(--star); clip-path: var(--star); }
.sbadge::before { content: ""; position: absolute; inset: 1.6px; background: var(--surface); -webkit-clip-path: var(--star); clip-path: var(--star); }
.sbadge b { position: relative; font-size: 14px; font-weight: 700; line-height: 1; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); }
.sbadge.on::before { inset: 2.4px; background: var(--gold-pale); }
.sbadge.on b { color: var(--ink); }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: center; }
.tabbar-in { display: flex; width: 100%; max-width: 30rem; }
.tab { flex: 1; height: var(--tab-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-3); font-size: 14px; font-weight: 500; position: relative; }
.tab[aria-selected="true"] { color: var(--cobalt); font-weight: 700; }
/* the tab in use: a small gold lozenge on the rule above it */
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: -4.5px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; background: var(--gold); transform: rotate(45deg); }
.tab .badge { position: absolute; top: 7px; inset-inline-start: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--tomato); color: #fff; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; font-variant-numeric: lining-nums; }

/* ------------------------------------------------------------ buttons, chips, controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 6px 18px; line-height: 1.2; text-align: center; border-radius: var(--r-m); border: 1px solid var(--rule); background: var(--surface); font-weight: 600; font-size: 16px; color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--on-accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 55%, transparent); }
.btn.ghost { background: none; border-color: transparent; color: var(--cobalt-ink); }
.btn.danger { color: var(--tomato); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 15px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 140px; min-width: 0; }
.seg { display: flex; background: var(--sunk); border-radius: var(--r-m); padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; height: 36px; border-radius: 7px; font-size: 15px; font-weight: 500; color: var(--ink-2); padding: 0 10px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--rule), 0 1px 2px rgba(60, 44, 18, .1); }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--rule); position: relative; flex: none; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch:checked { background: var(--accent-bg); }
.switch:checked::after { transform: translateX(18px); }
input[type="range"] { width: 100%; accent-color: var(--cobalt); }
.field { width: 100%; height: 46px; border-radius: var(--r-m); border: 1px solid var(--rule); background: var(--surface); padding: 0 14px; font-size: 17px; }
.field:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
textarea.field { height: 110px; padding: 10px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; resize: vertical; }

/* ------------------------------------------------------------ reader */
.reader { padding-block: 6px 120px; }
.surah-head { margin: 22px 0 6px; display: grid; justify-items: center; gap: 4px; text-align: center; }
/* the surah's name in a cartouche of gold rules, as in the running text of a printed mushaf */
.cartouche { position: relative; width: 100%; max-width: 30rem; padding: 10px 18px 8px; border-block: 1.5px solid var(--gold); }
.cartouche::before, .cartouche::after { content: ""; position: absolute; top: 50%; width: 9px; height: 9px; background: var(--gold); transform: translateY(-50%) rotate(45deg); }
.cartouche::before { left: -5px; } .cartouche::after { right: -5px; }
.cartouche .inner { border-block: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); padding: 6px 0 4px; background: color-mix(in srgb, var(--gold-pale) 45%, transparent); }
.cartouche .name-ar { font-family: var(--font-ar); font-weight: 700; font-size: 30px; line-height: 1.45; color: var(--ink); }
.cartouche .name-de { font-size: 17px; font-weight: 700; }
.surah-meta { font-size: 15px; font-style: italic; color: var(--ink-2); }
.basmala { font-family: var(--font-q); font-size: calc(var(--q-size) * 1.02); text-align: center; margin: 14px 0 4px; line-height: 2; color: var(--ink); }
.page { position: relative; }
.flow { font-family: var(--font-q); font-size: var(--q-size); line-height: 2.15; direction: rtl; text-align: justify; text-align-last: center; margin: 0; word-spacing: .04em; overflow-wrap: break-word; }
.pagebreak { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; color: var(--ink-3); font-size: 14px; font-style: italic; }
.pagebreak::before, .pagebreak::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold) 50%, transparent); opacity: .7; }
.pagebreak .pn { display: inline-flex; align-items: center; gap: 8px; }
.pagebreak .juzflag { color: var(--turq); }
.w { border-radius: 5px; transition: color .25s, background-color .25s; cursor: pointer; }
.w:hover { background: var(--sunk); }
.an { font-family: var(--font-q); color: var(--gold-line); cursor: pointer; padding: 0 .06em; white-space: nowrap; }
.an.mem { color: var(--cobalt); }
.hz { color: var(--gold); font-size: .8em; padding-inline-end: .2em; }
.verse-block { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-block .flow { text-align: right; text-align-last: right; }
.verse-block .tr { direction: ltr; font-size: 16.5px; line-height: 1.55; color: var(--ink-2); margin: 6px 0 0; }
.verse-block .vref { font-size: 13.5px; font-style: italic; color: var(--ink-3); margin-top: 6px; display: flex; gap: 10px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--gold-pale); } 100% { background: transparent; } }
.surah-nav { display: flex; justify-content: space-between; gap: 10px; margin: 26px 0 0; }
.surah-nav .btn { flex: 1; min-width: 0; }
.surah-nav .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------ the pages of the Madina Mushaf */
/* page: the ivory of the printed page; cover: the green leather the pages lie on (two pages, a tablet) */
:root { --page: #FCF7E8; --page-ink: #1E1A13; --frame: #A8822F; --frame-2: #2B624C; --page-hd: #F3E7C4; --page-shade: rgba(40, 30, 12, .3);
  --spine: rgba(60, 44, 18, .14); --cover: #234A3B; --cover-2: #1A3A2E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #1A1712; --page-ink: #EAE0C9; --frame: #C9A458; --frame-2: #6FAE8D;
  --page-hd: #2A2419; --page-shade: rgba(0, 0, 0, .55); --spine: rgba(0, 0, 0, .4); --cover: #0F1F18; --cover-2: #0A1510; } }
:root[data-theme="dark"] { --page: #1A1712; --page-ink: #EAE0C9; --frame: #C9A458; --frame-2: #6FAE8D;
  --page-hd: #2A2419; --page-shade: rgba(0, 0, 0, .55); --spine: rgba(0, 0, 0, .4); --cover: #0F1F18; --cover-2: #0A1510; }
/* the reader becomes the book: one page (or two, lying across) at a time, turned to the left like a mushaf */
#v-read.paged { max-width: none; padding: 0; height: calc(100vh - var(--tab-h) - env(safe-area-inset-bottom, 0px)); height: calc(100dvh - var(--tab-h) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; overflow: hidden; }
body.rec-on #v-read.paged { height: calc(100vh - var(--tab-h) - env(safe-area-inset-bottom, 0px) - 78px); height: calc(100dvh - var(--tab-h) - env(safe-area-inset-bottom, 0px) - 78px); }
#v-read.paged .topbar { position: relative; width: 100%; max-width: none; margin: 0; padding-inline: max(16px, calc(50% - 21rem + 16px)); flex: none;
  background: var(--page); backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
/* reading like a PDF: a tap on the margin of the page hides the bars, another brings them back */
body.immersive { --tab-h: 0px; }
body.immersive .tabbar, body.immersive #v-read.paged .topbar { display: none; }
.reader.mushaf { flex: 1 1 auto; min-height: 0; padding: 0; display: flex; direction: rtl; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  background: radial-gradient(ellipse 80% 70% at 50% 40%, rgba(255, 255, 255, .07), transparent 70%), var(--cover);
  box-shadow: inset 0 0 0 7px var(--cover), inset 0 0 0 8px color-mix(in srgb, var(--gold) 60%, transparent), inset 0 0 40px rgba(0, 0, 0, .25); }
.reader.mushaf::-webkit-scrollbar { display: none; }
/* a phone held upright: the paper of the page fills the screen */
.reader.mushaf.edge { background: var(--page); box-shadow: none; }
.mushaf .slide { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; overflow-y: auto; overflow-x: hidden;
  display: flex; justify-content: center; align-items: flex-start; padding: 7px 6px 7px; direction: rtl; overscroll-behavior-y: contain; }
.mushaf.edge .slide { padding: 0 0 var(--fab-room, 0px); align-items: center; }
.mushaf.spread .slide { padding: 10px 12px 10px; align-items: center; }
.mushaf.tall .slide { align-items: flex-start; scroll-padding-bottom: 20px; }
.mp { position: relative; flex: none; width: var(--pw); padding: calc(var(--pw) * .03) calc(var(--pw) * .035) calc(var(--pw) * .02); background: var(--page); color: var(--page-ink);
  border-radius: 2px 6px 6px 2px; box-shadow: 0 2px 4px var(--page-shade), 0 14px 34px -10px var(--page-shade); direction: rtl; }
.mushaf.edge .mp { border-radius: 0; box-shadow: none; }
/* a phone held upright: narrow margins, the type as large as the width allows (Mushaf.measure counts with these) */
.mushaf.edge .mp { padding: calc(var(--pw) * .02) calc(var(--pw) * .02) calc(var(--pw) * .01); }
.mushaf.edge .mp-box { padding: calc(var(--pw) * .012) calc(var(--pw) * .01); }
/* odd pages lie on the right of the open book, the binding on their left */
.mp.left { border-radius: 6px 2px 2px 6px; }
/* two pages: they meet at the binding, a soft shade in the fold */
.mushaf.spread .mp.right { border-radius: 0 6px 6px 0; background-image: linear-gradient(to right, var(--spine), transparent calc(var(--pw) * .08)); }
.mushaf.spread .mp.left { border-radius: 6px 0 0 6px; background-image: linear-gradient(to left, var(--spine), transparent calc(var(--pw) * .08)); }
/* above the frame: the juz and the surah, in the calligraphy of the print */
.mp-top { height: calc(var(--lh) * 1.1); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--pw) * .03);
  color: color-mix(in srgb, var(--page-ink) 82%, var(--page)); line-height: 1; }
.mp-top span { font-family: QCF4_QBSML; font-size: calc(var(--lh) * .5); white-space: nowrap; }
.mp-top span.txt { font-family: var(--font-q); font-size: calc(var(--fs) * .78); }
/* the frame: a band of gilded lozenges between two rules, rosettes in the corners (drawn by Orn in app.js);
   without it, a double rule in gold */
.mp-box { position: relative; padding: calc(var(--pw) * .012) calc(var(--pw) * .014); border: var(--band, 6px) double var(--gold); border-image: var(--orn-frame, none) 30 round; }
.mp-lines { font-size: var(--fs); line-height: var(--lh); height: calc(var(--lh) * 15); display: flex; flex-direction: column; }
.mp-lines.uni { font-family: var(--font-q); font-size: calc(var(--fs) * .84); }
.mp.opening .mp-lines { justify-content: center; }
.ml { height: var(--lh); flex: none; display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
.ml.c { justify-content: center; gap: .22em; }
.mp.opening .ml { height: calc(var(--lh) * 1.12); }
/* the first two pages: no plain frame, the surah's name and its text in an illuminated panel that fills the page */
.mp.opening .mp-box { border-color: transparent; border-image: none; }
.mp .op { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--lh) * .3) calc(var(--lh) * .5);
  border: calc(var(--band, 6px) * 1.25) double var(--gold); border-image: var(--orn-open, var(--orn-frame, none)) 30 round;
  background: radial-gradient(ellipse 70% 60% at 50% 55%, color-mix(in srgb, var(--gold-pale) 75%, transparent), transparent 80%); }
.mp .op .ml.hd { margin-bottom: calc(var(--lh) * .25); }
.mushaf .w, .mushaf .an, .mushaf .hz { flex: none; }
.mushaf .w { border-radius: 3px; padding: 0 .02em; }
/* a word of the page fonts can be several glyphs (لَّوۡ + مَا in 15:7, the sajda sign ۩, a pause sign drawn over the
   word): the fonts are made for right to left, but their code points count as left-to-right characters, so the order
   is set explicitly (tools/ui_order.js checks it) */
.mp-lines:not(.uni) .w { unicode-bidi: bidi-override; direction: rtl; }
/* the verse marker is a glyph of the page font (the rosette with its number), in the HAFS font without it */
.mushaf .an { font-family: inherit; color: var(--page-ink); padding: 0; cursor: pointer; }
.mushaf .hz { font-family: inherit; font-size: 1em; padding: 0; }
.mushaf .uni .an { color: var(--gold-line); }
.mushaf .an.mem { color: var(--frame-2); }
.mushaf .hz { color: var(--gold); }
/* a surah begins: its name in a medallion on a gilded cartouche with pointed ends */
.ml.hd { justify-content: center; cursor: pointer; }
.sbox { --pt: calc(var(--lh) * .42); position: relative; width: 100%; height: 86%; display: flex; align-items: center; justify-content: center; isolation: isolate; }
.sbox::before, .sbox::after { content: ""; position: absolute; z-index: -1;
  -webkit-clip-path: polygon(0 50%, var(--pt) 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, var(--pt) 100%);
  clip-path: polygon(0 50%, var(--pt) 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, var(--pt) 100%); }
.sbox::before { inset: 0; background: var(--gold-line); }
.sbox::after { inset: 1.4px 2.4px; background: var(--orn-band, none) center / auto 62% repeat-x, var(--page-hd); }
.sn { font-family: QCF4_QBSML; font-size: calc(var(--lh) * .54); line-height: 1; color: var(--page-ink); padding: .12em .95em .08em; border-radius: 50%; background: var(--page);
  box-shadow: 0 0 0 1.2px var(--gold-line), 0 0 0 3px var(--page), 0 0 0 4.2px var(--gold); }
.sn.txt { font-family: var(--font-q); font-size: calc(var(--fs) * .9); }
.ml.bs { justify-content: center; }
.mushaf .basmala { margin: 0; font-family: var(--font-q); font-size: calc(var(--fs) * .92); line-height: 1; color: var(--page-ink); }
.mushaf .basmala.qg { font-family: QCF4_Hafs_01; font-size: var(--fs); }
/* below the frame: the page number in an eight-pointed star between two gilded rules */
.mp-foot { height: calc(var(--lh) * 1.05); display: flex; align-items: center; justify-content: center; gap: calc(var(--fs) * .45); }
.mp-foot::before, .mp-foot::after { content: ""; width: calc(var(--pw) * .13); height: 1px; background: linear-gradient(to left, var(--gold), transparent); }
.mp-foot::after { background: linear-gradient(to right, var(--gold), transparent); }
.mp-no { --star: polygon(50% 0%, 64.64% 14.64%, 85.36% 14.64%, 85.36% 35.36%, 100% 50%, 85.36% 64.64%, 85.36% 85.36%, 64.64% 85.36%, 50% 100%, 35.36% 85.36%, 14.64% 85.36%, 14.64% 64.64%, 0% 50%, 14.64% 35.36%, 14.64% 14.64%, 35.36% 14.64%);
  position: relative; width: calc(var(--fs) * 1.85); height: calc(var(--fs) * 1.85); display: grid; place-items: center; background: var(--gold);
  -webkit-clip-path: var(--star); clip-path: var(--star); font-family: var(--font-ar); font-size: calc(var(--fs) * .64); line-height: 1; color: var(--page-ink); }
.mp-no::before { content: ""; position: absolute; inset: 1.3px; background: var(--page); -webkit-clip-path: var(--star); clip-path: var(--star); }
.mp-no b { position: relative; font-weight: 700; padding-top: .1em; }
/* while reciting the page text is a little lighter until it is read (the page itself stays as it is) */
.mushaf.reciting .w { color: color-mix(in srgb, var(--page-ink) 42%, var(--page)); }
.mushaf.reciting .w.s1, .mushaf.reciting .w.s7, .mushaf.reciting .w.tt, .mushaf.reciting .w.s2, .mushaf.reciting .w.s3, .mushaf.reciting .w.s4,
.mushaf.reciting .w.s5, .mushaf.reciting .w.s6, .mushaf.reciting .w.s8 { color: var(--page-ink); }
.mushaf.reciting .w.hn { color: var(--saffron); }
.mushaf.reciting .basmala { color: color-mix(in srgb, var(--page-ink) 42%, var(--page)); }
.mushaf.reciting .basmala.heard { color: var(--page-ink); }
.mushaf .w.cur { box-shadow: 0 2px 0 var(--cobalt); }
/* memorising on the page: a thin caret where the next word belongs */
.mushaf.hide .w.cur:not(.v) { position: relative; box-shadow: none; animation: none; }
.mushaf.hide .w.cur:not(.v)::after { content: ""; position: absolute; right: -1px; top: 16%; bottom: 14%; width: 2px; border-radius: 1px; background: var(--cobalt); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.mushaf .flash { animation: flash 1.6s ease-out; }

/* tajweed */
.tj-m2 { color: var(--tj-m2); } .tj-m246 { color: var(--tj-m246); } .tj-m45 { color: var(--tj-m45); } .tj-m6 { color: var(--tj-m6); }
.tj-gh { color: var(--tj-gh); } .tj-id { color: var(--tj-id); } .tj-qq { color: var(--tj-qq); } .tj-sl { color: var(--tj-sl); }

/* recitation states */
.reciting .w { color: var(--ink-3); }
.reciting .w.s1, .reciting .w.s7, .reciting .w.tt { color: var(--ink); }
.reciting .w.s2, .reciting .w.s3, .reciting .w.s4, .reciting .w.s5, .reciting .w.s6 { color: var(--ink); }
.reciting.tajweed .w.s1 [class^="tj-"], .reciting.tajweed .w.tt [class^="tj-"] { color: inherit; }
.reciting .basmala { color: var(--ink-3); transition: color .25s; }
.reciting .basmala.heard { color: var(--ink); }
.marks .w.s2 { background-image: radial-gradient(circle, var(--tomato) 1.3px, transparent 1.7px); background-size: 7px 4px; background-repeat: repeat-x; background-position: 0 92%; }
/* other words and finer differences only when the chosen strictness asks for them (the recogniser is not sure enough) */
.marks.lv2 .w.s3, .marks.lv2 .w.s6 { background-color: var(--saffron-soft); box-shadow: inset 0 -2px 0 var(--saffron); }
.marks.lv1 .w.s4, .marks.lv2 .w.s4, .marks.lv2 .w.s5 { background-color: var(--tomato-soft); box-shadow: inset 0 -2px 0 var(--tomato); }
.marks .w.s7 { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--turq) 55%, transparent); }
.w.cur { box-shadow: 0 2px 0 var(--cobalt); color: var(--ink); }
/* memorising: the page stands as it is, with its verse markers (and on the mushaf pages every line in its place);
   a word appears where it belongs once it is recited. A thin mark at the start of a word shows where the text goes on. */
.hide .w:not(.v), .hide .w:not(.v) * { color: transparent !important; }
.hide .w:not(.v) { background: none; }
/* a test of a passage: the text around it stays faintly readable */
.hide .w.ctx:not(.v), .hide .w.ctx:not(.v) * { color: color-mix(in srgb, var(--ink) 32%, transparent) !important; }
.mushaf.hide .w.ctx:not(.v), .mushaf.hide .w.ctx:not(.v) * { color: color-mix(in srgb, var(--page-ink) 30%, var(--page)) !important; }
.hide .w.cur:not(.v) { box-shadow: inset -2px 0 0 var(--cobalt); animation: caret 1.1s steps(1) infinite; }
@keyframes caret { 50% { box-shadow: none; } }
.hide .w.cur.v { box-shadow: none; }
.hide .verse-block:not(.done) .tr, .hide .verse-block:not(.done) .vref { visibility: hidden; }
/* a word the app showed as a hint, and a word recited after that hint */
.reciting .w.hn { color: var(--saffron); background-color: var(--saffron-soft); }
.reciting .w.s8 { color: var(--ink); }
.marks .w.s8 { background-image: radial-gradient(circle, var(--saffron) 1.3px, transparent 1.7px); background-size: 7px 4px; background-repeat: repeat-x; background-position: 0 92%; }

/* ------------------------------------------------------------ recite button + bar */
.fab { position: fixed; z-index: 25; right: max(16px, calc(50% - 21rem + 16px)); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px);
  height: 52px; padding: 0 24px 0 18px; border-radius: 26px; border: 0; background: var(--accent-bg); color: var(--on-accent); font-weight: 700; font-size: 17.5px;
  display: flex; align-items: center; gap: 8px;
  box-shadow: inset 0 0 0 2px var(--accent-bg), inset 0 0 0 3px color-mix(in srgb, var(--gold) 85%, transparent), 0 8px 20px -6px rgba(25, 40, 30, .5); }
.fab svg { width: 22px; height: 22px; }
.rec-top { display: none; flex: none; height: 42px; min-width: 42px; padding: 0 10px; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 21px;
  background: var(--accent-bg); color: var(--on-accent); font-weight: 700; font-size: 16px; box-shadow: inset 0 0 0 2px var(--accent-bg), inset 0 0 0 3px color-mix(in srgb, var(--gold) 85%, transparent); }
.rec-top svg { width: 21px; height: 21px; }
.rec-top span { display: none; }
/* a phone held upright: the button sits in the last row of the page, beside the page number (Mushaf.measure) */
body.fab-foot .fab { bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + var(--fab-bottom, 12px)); right: 10px;
  height: var(--fab-h, 46px); border-radius: calc(var(--fab-h, 46px) / 2); padding: 0 18px 0 14px; font-size: 16px; gap: 7px; }
body.fab-foot .fab svg { width: 20px; height: 20px; }
body.fab-foot.fab-round .fab { width: var(--fab-h, 46px); padding: 0; justify-content: center; }
body.fab-foot.fab-round .fab span { display: none; }
body.mic-top .fab { display: none !important; }
body.mic-top:not(.rec-on) .rec-top { display: inline-flex; }
@media (min-width: 560px) { .rec-top { padding: 0 16px 0 12px; } .rec-top span { display: inline; } }
/* a phone lying across: the bars take less of the little height there is */
@media (orientation: landscape) and (max-height: 540px) {
  :root { --tab-h: 46px; }
  .tab { flex-direction: row; gap: 8px; font-size: 13px; }
  .tab .badge { top: 5px; }
  #v-read.paged .topbar { padding-top: 3px; padding-bottom: 3px; }
  #v-read.paged .title-btn { min-height: 40px; padding-block: 2px; }
  #v-read.paged .title-btn .sbadge { width: 32px; height: 32px; }
  #v-read.paged .title-btn .tt { flex-direction: row; align-items: baseline; gap: 10px; }
}
.recbar { position: fixed; z-index: 26; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px 10px; pointer-events: none; }
.recbar-in { pointer-events: auto; width: 100%; max-width: 40rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px; }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); flex: none; position: relative; }
.recbar[data-state="listening"] .rec-dot { background: var(--tomato); }
.recbar[data-state="speech"] .rec-dot { background: var(--tomato); }
.recbar[data-state="speech"] .rec-dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--tomato); opacity: .5; animation: ping 1.1s ease-out infinite; }
@keyframes ping { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.4); opacity: 0; } }
.rec-info { flex: 1; min-width: 0; }
.rec-info .l1 { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-info .l2 { font-size: 14px; font-style: italic; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the two pages when the screen does not turn by itself: offered while the phone is held across */
.turn-offer { position: fixed; z-index: 45; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(var(--turn, 0deg)); display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; background: var(--accent-bg); color: var(--on-accent); border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent); box-shadow: var(--shadow); font: 700 18px/1.1 var(--font-ui); white-space: nowrap; animation: turnIn .35s ease-out; }
.turn-offer .i { width: 24px; height: 24px; flex: none; }
.turn-offer[hidden] { display: none; }
@keyframes turnIn { from { opacity: 0; } to { opacity: 1; } }
.rec-info .l2.phrase { font-style: normal; color: var(--cobalt); display: flex; align-items: center; gap: 4px; }
.rec-info .l2.phrase .i { width: 16px; height: 16px; flex: none; stroke-width: 2.4; }
.rec-info .l2.phrase span { overflow: hidden; text-overflow: ellipsis; }
.rec-info .heard { font-family: var(--font-q); direction: ltr; text-align: right; text-overflow: clip; font-size: 15px; color: var(--ink-3); }
.rec-info .heard span { direction: rtl; unicode-bidi: isolate; }
.recbar .btn.stop { background: var(--ink); color: var(--paper); border-color: var(--ink); min-height: 42px; padding: 0 14px; }
.recbar.paused #rec-hide, .recbar.paused #rec-help { display: none; }
.recbar.paused #rec-stop span, .recbar.strict #rec-stop span { display: none; }
.recbar.paused #rec-stop, .recbar.strict #rec-stop { padding: 0 12px; }
.capbar .rec-dot { background: var(--tomato); }
.capbar[data-state="idle"] .rec-dot { background: var(--ink-3); }
.capbar[data-state="speech"] .rec-dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--tomato); opacity: .5; animation: ping 1.1s ease-out infinite; }
.capbar .l2 { display: flex; align-items: center; gap: 8px; font-style: normal; }
.capbar .l2 span:last-child { overflow: hidden; text-overflow: ellipsis; }
.cap-meter { flex: none; width: 56px; height: 6px; border-radius: 3px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; }
.cap-meter i { display: block; height: 100%; width: 0; background: var(--cobalt); transition: width .1s linear; }
.cap-meter.hot i { background: var(--tomato); }
.capbar.paused .cap-meter, .capbar.paused #cap-x { display: none; }
.capbar.paused #cap-done span { display: none; }
.capbar.paused #cap-done { padding: 0 12px; }
.rc-item .icon-btn.armed { color: var(--tomato); background: var(--sunk); }
.asr-load { display: flex; align-items: center; gap: 10px; margin-top: 2px; font-size: 14px; color: var(--ink-2); }
.asr-bar { flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; }
.asr-bar i { display: block; height: 100%; width: 0; background: var(--cobalt); transition: width .2s linear; }
.asr-load span { flex: none; }
.recbar-in.miss { animation: miss .5s ease-out; }
@keyframes miss { 0% { border-color: var(--tomato); transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-1px); } 100% { border-color: var(--rule); transform: none; } }
#rec-help { color: var(--saffron); }
/* attempts left: small dots, used ones filled */
.tries { display: inline-flex; gap: 4px; vertical-align: middle; margin-inline-end: 6px; }
.tries i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--tomato); }
.tries i.used { background: var(--tomato); }
/* the hint: a quiet card above the bar */
.rec-hint { pointer-events: auto; width: 100%; max-width: 40rem; display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--saffron) 45%, var(--rule)); box-shadow: var(--shadow); animation: hint-in .25s ease-out; }
@keyframes hint-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.rec-hint .hi { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--saffron-soft); color: var(--saffron); }
.rec-hint .hi svg { width: 20px; height: 20px; }
.rec-hint .ht { flex: 1; min-width: 0; font-size: 16px; line-height: 1.4; font-weight: 600; }
.rec-hint .ht small { display: block; font-size: 14px; font-weight: 400; font-style: italic; color: var(--ink-2); }
.rec-hint .ht .q { display: block; font-size: 28px; line-height: 1.7; font-weight: 400; text-align: right; color: var(--saffron); }
.rec-hint .ht.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rec-hint .ht.row .q { display: inline; min-width: 0; overflow-wrap: anywhere; }
.rec-hint .hx { width: 36px; height: 36px; color: var(--ink-3); }
.rec-hint .hx svg { width: 18px; height: 18px; }
/* what the app says while memorising: a word not heard (warn), left out or wrong (err), let through (info) */
.rec-hint[data-tone="warn"] { border-color: color-mix(in srgb, var(--saffron) 60%, var(--rule)); }
.rec-hint[data-tone="err"] { border-color: color-mix(in srgb, var(--tomato) 55%, var(--rule)); }
.rec-hint[data-tone="err"] .hi { background: var(--tomato-soft); color: var(--tomato); }
.rec-hint[data-tone="err"] .ht .q { color: var(--tomato); }
.rec-hint[data-tone="info"] { border-color: color-mix(in srgb, var(--gold) 45%, var(--rule)); }
.rec-hint[data-tone="info"] .hi { background: var(--sunk); color: var(--ink-2); }
.linkish { display: inline-block; margin-top: 2px; padding: 4px 0; border: 0; background: none; color: var(--cobalt-ink); font-size: 15px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
/* Arabic inside a German sentence: a mushaf word, or what the recogniser heard */
.qw, .qh { font-family: var(--font-q); font-size: 1.22em; line-height: 1; font-weight: 400; unicode-bidi: isolate; white-space: nowrap; }
.qw { color: var(--cobalt-ink); }
.qh { color: var(--tomato); }

/* ------------------------------------------------------------ blind test: no text, a teacher who listens */
.blind { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); animation: bl-in .3s ease-out; }
@keyframes bl-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.blind-on, .blind-on body { overflow: hidden; }
.bl-top, .bl-band, .bl-bar { width: 100%; max-width: 42rem; margin: 0 auto; }
.bl-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.bl-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.25; }
.bl-title b { max-width: 100%; font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl-title span { max-width: 100%; font-size: 14px; font-style: italic; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl-mic { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); display: grid; place-items: center; padding: 0; }
.bl-mic .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); position: relative; }
.bl-mic[data-state="listening"] .dot, .bl-mic[data-state="speech"] .dot { background: var(--tomato); }
.bl-mic[data-state="speech"] .dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--tomato); opacity: .5; animation: ping 1.1s ease-out infinite; }
.bl-mic .pp { display: none; color: var(--cobalt); }
.bl-mic[data-state="paused"] { border-color: var(--cobalt); }
.bl-mic[data-state="paused"] .dot { display: none; }
.bl-mic[data-state="paused"] .pp { display: grid; }
/* one piece per verse: right (turquoise), with help (saffron), unsure (tomato), the verse now (cobalt) */
.bl-band { display: flex; gap: 3px; padding: 6px 16px 0; }
.bl-band i { flex: 1 1 0; min-width: 2px; height: 6px; border-radius: 3px; background: var(--sunk); transition: background-color .3s; }
.bl-band i.ok { background: var(--turq); }
.bl-band i.help { background: var(--saffron); }
.bl-band i.bad { background: var(--tomato); }
.bl-band i.cur { background: var(--cobalt); }
.bl-band.bar { position: relative; height: 6px; padding: 0; margin-top: 6px; width: calc(100% - 32px); max-width: calc(42rem - 32px); border-radius: 3px; background: var(--sunk); }
.bl-band.bar .fill { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--turq); border-radius: 3px; transition: width .3s; }
.bl-band.bar .mark { position: absolute; top: -3px; width: 4px; height: 12px; margin-inline-start: -2px; border-radius: 2px; background: var(--cobalt); }
.bl-stage { flex: 1 1 auto; min-height: 0; overflow-y: auto; width: 100%; max-width: 42rem; margin: 0 auto; padding: 14px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.bl-verse { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bl-vl { font-size: 15px; font-style: italic; color: var(--ink-2); }
/* the verse number in an eight-pointed star, like the end of a verse in the mushaf */
.bl-rosette { --star: polygon(50% 0%, 64.64% 14.64%, 85.36% 14.64%, 85.36% 35.36%, 100% 50%, 85.36% 64.64%, 85.36% 85.36%, 64.64% 85.36%, 50% 100%, 35.36% 85.36%, 14.64% 85.36%, 14.64% 64.64%, 0% 50%, 14.64% 35.36%, 14.64% 14.64%, 35.36% 14.64%);
  position: relative; width: 116px; height: 116px; display: grid; place-items: center; background: var(--gold); -webkit-clip-path: var(--star); clip-path: var(--star); }
.bl-rosette::before { content: ""; position: absolute; inset: 3px; background: var(--paper); -webkit-clip-path: var(--star); clip-path: var(--star); }
.bl-rosette::after { content: ""; position: absolute; inset: 9px; background: var(--gold-pale); box-shadow: inset 0 0 0 1.5px var(--gold); -webkit-clip-path: var(--star); clip-path: var(--star); }
.bl-rosette b { position: relative; z-index: 1; font-size: 42px; line-height: 1; font-weight: 800; color: var(--ink); }
.bl-rosette.turn { animation: bl-turn .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes bl-turn { from { transform: rotate(-45deg) scale(.82); } to { transform: none; } }
.bl-of { font-size: 15px; font-style: italic; color: var(--ink-2); }
.bl-card { width: 100%; max-width: 34rem; padding: 18px 18px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--rule); box-shadow: var(--shadow); text-align: center; }
.bl-card.pop { animation: hint-in .25s ease-out; }
.bl-card.miss { animation: miss .5s ease-out; }
.bl-msg { font-size: 21px; line-height: 1.4; font-weight: 700; overflow-wrap: anywhere; }
.bl-msg svg { width: 22px; height: 22px; stroke-width: 2.5; vertical-align: -4px; margin-inline-end: 2px; }
.bl-ar { font-size: 34px; line-height: 1.95; margin-top: 6px; overflow-wrap: anywhere; }
.bl-small { margin-top: 6px; font-size: 15.5px; line-height: 1.45; font-style: italic; color: var(--ink-2); }
.bl-tries { margin-top: 10px; font-size: 14.5px; color: var(--ink-2); }
.bl-card[data-tone="ok"] { border-color: color-mix(in srgb, var(--turq) 45%, var(--rule)); background: color-mix(in srgb, var(--turq-soft) 55%, var(--surface)); }
.bl-card[data-tone="ok"] .bl-msg { color: var(--turq); }
.bl-card[data-tone="warn"] { border-color: color-mix(in srgb, var(--saffron) 55%, var(--rule)); }
.bl-card[data-tone="err"] { border-color: color-mix(in srgb, var(--tomato) 55%, var(--rule)); background: color-mix(in srgb, var(--tomato-soft) 45%, var(--surface)); }
.bl-card[data-tone="err"] .bl-ar { color: var(--tomato); }
.bl-card[data-tone="hint"] { border-color: color-mix(in srgb, var(--saffron) 55%, var(--rule)); background: color-mix(in srgb, var(--saffron-soft) 45%, var(--surface)); }
.bl-card[data-tone="hint"] .bl-ar { color: var(--saffron); }
.bl-card[data-tone="info"] .bl-msg { color: var(--ink-2); }
.bl-heard { min-height: 2em; max-width: 100%; font-size: 20px; line-height: 1.9; color: var(--ink-3); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl-bar { display: flex; gap: 10px; padding: 8px 16px 14px; }
.bl-bar .btn { flex: 1 1 0; min-width: 0; padding-inline: 10px; gap: 6px; }
.bl-bar .btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bl-hint svg { color: var(--saffron); }
/* the way in, in the hifz tab */
.bl-entry { width: 100%; display: flex; align-items: center; gap: 14px; margin: 22px 0 0; padding: 14px 10px 14px 14px; border-radius: var(--r-m); text-align: start;
  border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--rule)); background: var(--surface); }
.bl-entry .ic { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-bg); color: var(--on-accent);
  box-shadow: inset 0 0 0 2px var(--accent-bg), inset 0 0 0 3px color-mix(in srgb, var(--gold) 85%, transparent); }
.bl-entry .txt { flex: 1; min-width: 0; }
.bl-entry .txt b { display: block; font-size: 18px; font-weight: 700; }
.bl-entry .txt span { display: block; font-size: 15px; line-height: 1.4; color: var(--ink-2); }
.bl-entry > svg { color: var(--gold); }
.cs-go > .grow { flex-basis: 90px; padding-inline: 10px; }
/* the verses after a blind test */
.bl-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.bl-chip { min-width: 36px; height: 32px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); font-size: 15px; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; color: var(--ink-3); }
.bl-chip.ok { background: var(--turq-soft); border-color: transparent; color: var(--turq); }
.bl-chip.help { background: var(--saffron-soft); border-color: transparent; color: var(--saffron); }
.bl-chip.bad { background: var(--tomato-soft); border-color: transparent; color: var(--tomato); }
@media (prefers-reduced-motion: reduce) { .blind, .bl-card.pop, .bl-card.miss, .bl-rosette.turn, .bl-mic .dot::after { animation: none; } }

/* ------------------------------------------------------------ sheets */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); opacity: 0; transition: opacity .22s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 42rem; max-height: 88vh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: var(--r-l) var(--r-l) 0 0; box-shadow: var(--shadow), inset 0 3px 0 -1px color-mix(in srgb, var(--gold) 40%, transparent); transform: translateY(102%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.open { transform: none; }
.sheet:focus { outline: none; }
.sheet.full { max-height: 100vh; height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); }
.sheet-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--rule); margin: 9px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 8px 20px; flex: none; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 23px; line-height: 1.2; margin: 0; font-weight: 700; }
.sheet-body { overflow-y: auto; flex: 1 1 auto; padding: 4px 20px 24px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .w { transition: none; } .flash, .hide .w.cur:not(.v), .rec-hint, .recbar-in.miss { animation: none; } }

.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--rule); background: none; border-inline: 0; border-top: 0; text-align: start; width: 100%; }
.li:last-child { border-bottom: 0; }
.li .no { width: 30px; flex: none; font-size: 15px; color: var(--ink-3); font-weight: 600; text-align: center; font-variant-numeric: lining-nums tabular-nums; }
.li .main { flex: 1; min-width: 0; }
.li .main .a { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .main .b { display: block; font-size: 14.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .ar { font-size: 22px; line-height: 1.4; color: var(--ink); flex: none; }
.li .meter { width: 54px; height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; flex: none; }
.li .meter i { display: block; height: 100%; background: var(--cobalt); }
.li.active { background: var(--cobalt-soft); border-radius: 8px; }

.section-title { font-size: 20px; font-weight: 700; margin: 30px 0 10px; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; white-space: nowrap; }
.section-title small { font-weight: 400; font-style: italic; color: var(--ink-2); font-size: 15px; white-space: normal; }
/* a section of the page: its title, then a gilded rule to the end of the line */
.section-title::after { content: ""; flex: 1 1 24px; height: 1px; align-self: center; background: linear-gradient(to right, color-mix(in srgb, var(--gold) 55%, transparent), transparent); }
.muted { color: var(--ink-2); }
.tiny { font-size: 14px; color: var(--ink-3); }
.note { font-size: 15.5px; color: var(--ink-2); line-height: 1.5; }
.panel { background: var(--sunk); border-radius: var(--r-m); padding: 14px 16px; }
.setting { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.setting:last-child { border-bottom: 0; }
.setting .txt { flex: 1; min-width: 0; }
.setting .txt b { display: block; font-weight: 700; font-size: 17px; }
.setting .txt span { display: block; font-size: 14.5px; line-height: 1.4; color: var(--ink-2); }
.setting.col { flex-direction: column; align-items: stretch; }
.setting .sub { display: flex; align-items: center; gap: 12px; }

/* word + verse sheets */
.word-big { font-family: var(--font-q); font-size: 46px; line-height: 1.7; text-align: center; direction: rtl; margin: 4px 0 0; }
.gloss { text-align: center; font-size: 24px; font-weight: 700; margin: 0; }
.gloss-sub { text-align: center; font-size: 15.5px; font-style: italic; color: var(--ink-2); margin: 4px 0 0; }
.parts { display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px 0 6px; }
.part { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px 8px; text-align: center; min-width: 64px; background: var(--surface); }
.part .pa { font-family: var(--font-q); font-size: 26px; line-height: 1.6; direction: rtl; }
.part .pd { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.part.stem { border-color: var(--gold); background: var(--gold-pale); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 15.5px; margin: 14px 0 0; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; min-width: 0; }
.rule-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; padding: 3px 10px 3px 8px; border-radius: 6px; background: var(--sunk); margin: 0 6px 6px 0; }
.rule-chip i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; display: inline-block; }
.verse-ar { font-family: var(--font-q); font-size: 25px; line-height: 2.1; direction: rtl; text-align: right; margin: 6px 0 4px; }
.verse-de { font-size: 17px; line-height: 1.6; margin: 0; }

/* ------------------------------------------------------------ hifz */
.hero { padding: 6px 0 2px; }
.hero .big { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 2px; font-size: 56px; line-height: 1.02; font-weight: 800; }
.hero .big small { flex: 1 1 10rem; min-width: 0; font-size: 19px; line-height: 1.3; font-weight: 400; font-style: italic; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 16px 0 0; border-block: 1px solid var(--rule); }
.stat { padding: 10px 12px 9px; }
.stat + .stat { border-inline-start: 1px solid var(--rule); }
.stat b { display: block; font-size: 26px; line-height: 1.15; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; }
.stat span { font-size: 14.5px; font-style: italic; color: var(--ink-2); }
.mosaic { display: grid; gap: 3px; margin: 18px 0 4px; }
.mrow { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 6px; }
.mrow .jl { font-size: 12.5px; color: var(--ink-3); font-weight: 600; text-align: end; font-variant-numeric: lining-nums tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(23, minmax(0, 1fr)); gap: 3px; }
.tile { aspect-ratio: 1; border-radius: 2px; border: 1px solid var(--rule); background: transparent; padding: 0; position: relative; max-width: 100%; }
.tile.p1 { background: color-mix(in srgb, var(--cobalt) 22%, transparent); border-color: transparent; }
.tile.p2 { background: color-mix(in srgb, var(--cobalt) 50%, transparent); border-color: transparent; }
.tile.full { background: var(--cobalt); border-color: var(--cobalt); }
.tile.due::after { content: ""; position: absolute; inset: 26%; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 1.5px var(--surface); }
.tile.here { border-color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .tile { width: 12px; display: inline-block; }
.due-card { border: 1px solid var(--rule); border-radius: var(--r-m); padding: 4px 14px; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; }
.vchip { min-width: 40px; height: 36px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); font-size: 15px; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; color: var(--ink-2); }
.vchip[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--on-accent); }

/* ------------------------------------------------------------ words */
.coverage { margin: 8px 0 0; }
.cov-bar { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; display: flex; }
.cov-bar i { display: block; height: 100%; }
.cov-bar .k { background: var(--cobalt); } .cov-bar .l { background: color-mix(in srgb, var(--cobalt) 35%, transparent); }
.lemma-row .ar { font-family: var(--font-q); font-size: 24px; line-height: 1.5; min-width: 70px; text-align: end; }
.pill { font-size: 13px; font-weight: 600; font-style: italic; padding: 1px 8px; border-radius: 5px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill.new { background: var(--cobalt-soft); color: var(--cobalt-ink); }
.pill.learn { background: var(--saffron-soft); color: var(--saffron); }
.pill.known { background: var(--cobalt-soft); color: var(--cobalt-ink); }
.card-stage { display: flex; flex-direction: column; min-height: 100%; padding-bottom: 8px; }
.sheet.full .sheet-body { display: flex; flex-direction: column; }
.sheet.full .card-stage { flex: 1; }
.flashcard { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px 0 20px; gap: 6px; }
.flashcard .fa { font-family: var(--font-q); font-size: 64px; line-height: 1.6; direction: rtl; }
.flashcard .root { font-size: 15.5px; font-style: italic; color: var(--ink-3); }
.flashcard .root .q { font-size: 1.4em; line-height: 1; color: var(--ink-2); }
.flashcard .fde { font-size: 29px; font-weight: 700; margin-top: 4px; }
.flashcard .ex { margin-top: 16px; max-width: 34rem; }
.flashcard .ex .q { font-size: 24px; line-height: 2; }
mark { background: var(--gold-pale); color: inherit; border-radius: 3px; padding: 0 2px; }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate .btn { flex-direction: column; height: 58px; gap: 1px; padding: 0 4px; min-width: 0; }
.rate .btn small { font-weight: 400; font-style: italic; font-size: 13px; color: var(--ink-3); }
.progress-line { height: 3px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.progress-line i { display: block; height: 100%; background: var(--cobalt); transition: width .3s; }

/* vocabulary test */
.qz-q { flex: 0 0 auto; padding: 16px 0 12px; }
.qz-q .fa { font-size: clamp(38px, 12.5vw, 60px); }
.qz-opts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.qz-opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.qz-opt { position: relative; min-height: 56px; padding: 10px 40px 10px 16px; border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--surface); text-align: start;
  font-size: 17.5px; font-weight: 600; line-height: 1.3; color: var(--ink); transition: background-color .15s, border-color .15s, opacity .2s; }
.qz-opt:active { background: var(--sunk); }
.qz-opt.right { background: var(--cobalt-soft); border-color: var(--cobalt); box-shadow: inset 0 0 0 1px var(--cobalt); }
.qz-opt.wrong { background: var(--tomato-soft); border-color: var(--tomato); box-shadow: inset 0 0 0 1px var(--tomato); }
.qz-opt.dim { opacity: .45; }
.qz-opt.right::after, .qz-opt.wrong::after { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 17px; font-weight: 700; line-height: 1; }
.qz-opt.right::after { content: "✓"; color: var(--cobalt); }
.qz-opt.wrong::after { content: "✕"; color: var(--tomato); }
.ar-opt { text-align: center; padding: 2px 10px; }
.ar-opt .q { font-size: 29px; line-height: 1.85; }
.ar-opt.right::after, .ar-opt.wrong::after { top: 9px; right: 10px; transform: none; font-size: 13px; }

/* ------------------------------------------------------------ surah / juz / page picker */
.pk-head { position: sticky; top: -4px; z-index: 3; background: var(--surface); margin: 0 -20px; padding: 6px 20px 6px; box-shadow: 0 -12px 0 var(--surface); }
.pk-head::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; background: linear-gradient(var(--surface), transparent); pointer-events: none; }
.pk-head + .list { padding-top: 10px; }
.pk-search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: var(--r-m); background: var(--sunk); color: var(--ink-3); cursor: text; transition: box-shadow .15s, background-color .15s; }
.pk-search:focus-within { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--gold); color: var(--ink-2); }
.pk-search svg { width: 20px; height: 20px; }
.pk-search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; padding: 0; font-size: 17px; color: var(--ink); outline: none; -webkit-appearance: none; appearance: none; }
.pk-search input::placeholder { color: var(--ink-3); }
.pk-search input::-webkit-search-decoration { -webkit-appearance: none; }
.pk-chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 10px -20px 0; padding: 0 20px; }
.pk-chips::-webkit-scrollbar { display: none; }
.pk-chips .lbl { flex: none; font-size: 15px; font-style: italic; color: var(--ink-2); }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--rule); background: var(--surface); font-size: 15.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.chip:active { background: var(--sunk); }
.pk-head .seg { margin-top: 10px; }
.pk-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 8px 8px 8px 4px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: start; }
.pk-row:last-child { border-bottom: 0; }
.pk-row:active { background: var(--sunk); }
.pk-row.active { background: var(--gold-pale); border-radius: 8px; border-bottom-color: transparent; }
.pk-row:has(+ .pk-row.active) { border-bottom-color: transparent; }
.pk-row .main { flex: 1; min-width: 0; }
.pk-row .main .a { display: flex; align-items: baseline; gap: 6px; font-size: 18px; font-weight: 700; white-space: nowrap; }
.pk-row .main .a .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* as in the index of a mushaf: the name, a dotted leader, the page */
.pk-row .main .a .lead { flex: 1 1 12px; min-width: 12px; border-bottom: 1.5px dotted color-mix(in srgb, var(--gold) 70%, transparent); transform: translateY(-.25em); }
.pk-row .main .a .pg { flex: none; font-size: 15.5px; font-weight: 500; color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; }
.pk-row .main .b { display: block; font-size: 15px; font-style: italic; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-row.go .main .a { color: var(--cobalt-ink); }
.pk-row .ar { flex: none; min-width: 74px; text-align: end; font-size: 23px; line-height: 1.4; color: var(--ink); }
.pk-row > svg { width: 20px; height: 20px; color: var(--ink-3); }
.pk-row .pill { flex: none; }
.pk-mem { display: block; height: 3px; max-width: 140px; margin-top: 6px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.pk-mem i { display: block; height: 100%; border-radius: inherit; background: var(--cobalt); }
.pk-row.active .pk-mem { background: color-mix(in srgb, var(--gold) 25%, transparent); }
.juz-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 2px; }
.juz-tile { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 10px 12px 11px; border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--surface); text-align: start; }
.juz-tile:active { background: var(--sunk); }
.juz-tile b { font-size: 28px; line-height: 1.1; font-weight: 800; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); }
.juz-tile > span:not(.pk-mem) { max-width: 100%; margin-top: 4px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.juz-tile > span.tiny { margin-top: 0; font-size: 13.5px; font-weight: 400; font-style: italic; color: var(--ink-3); }
.juz-tile .pk-mem { align-self: stretch; max-width: none; }
.juz-tile.active { border-color: var(--gold); background: var(--gold-pale); box-shadow: inset 0 0 0 1px var(--gold); }
.pk-page { padding: 20px 0 6px; }
.pk-page-num { display: flex; align-items: center; justify-content: center; gap: 16px; }
.pk-page-num output { min-width: 3.4ch; text-align: center; font-size: 60px; line-height: 1.05; font-weight: 800; }
.pk-page-num .icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--rule); color: var(--ink); }
.pk-page input[type="range"] { display: block; margin: 18px 0 2px; height: 28px; }
.head-link { margin-top: 2px; color: var(--cobalt-ink); }
.head-link svg { width: 18px; height: 18px; }

/* summary */
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font-size: 56px; line-height: 1; font-weight: 800; }
.issue { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); width: 100%; background: none; border-inline: 0; border-top: 0; text-align: start; }
