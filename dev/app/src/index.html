<title>MyHifz</title>
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column (max 42rem) over a white page; the mushaf text is the hero; tabs at the bottom; sheets rise from below.
   Signature: Hifz progress drawn as an Iznik-style tile mosaic (30 juz rows x their pages). */
@font-face { font-family: "Hafs"; src: url("/*FONT_HAFS*/") format("woff2"); font-display: block; }
:root {
  --paper: #FBFCFD;
  --surface: #FFFFFF;
  --sunk: #EEF2F7;
  --ink: #142033;
  --ink-2: #4A566B;
  --ink-3: #8A96AA;
  --rule: #DCE3EC;
  --cobalt: #2347A8;
  --cobalt-ink: #1B3A8C;
  --cobalt-soft: #E5EBF9;
  --turq: #0F7D77;
  --turq-soft: #D9F0EC;
  --tomato: #C2412E;
  --tomato-soft: #FBE7E3;
  --saffron: #A2690B;
  --saffron-soft: #F8EDD9;
  --hide: #E4E9F1;
  --scrim: rgba(12, 20, 36, .42);
  --shadow: 0 10px 30px rgba(20, 32, 51, .14), 0 2px 6px rgba(20, 32, 51, .06);
  --tj-m2: #8457C4; --tj-m246: #6A3DB0; --tj-m45: #9A2A88; --tj-m6: #B0105C;
  --tj-gh: #1E8546; --tj-id: #5B8780; --tj-qq: #1C78AE; --tj-sl: #A3ADBC;
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-ar: "Reem Kufi", "Noto Kufi Arabic", "Geeza Pro", "Segoe UI", sans-serif;
  --font-q: "Hafs", "KFGQPC HAFS Uthmanic Script", "Amiri Quran", "Traditional Arabic", serif;
  --q-size: 27px;
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
  --tab-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1424; --surface: #141D31; --sunk: #1B2640; --ink: #E6EBF4; --ink-2: #A9B4C8; --ink-3: #6F7C94;
    --rule: #26324C; --cobalt: #7FA0FF; --cobalt-ink: #A9BFFF; --cobalt-soft: #1E2C52; --turq: #3CC2B4; --turq-soft: #123A3A;
    --tomato: #FF7F6B; --tomato-soft: #3E1F1E; --saffron: #E4B24E; --saffron-soft: #3A2E16; --hide: #222E4A;
    --scrim: rgba(3, 6, 14, .6); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    --tj-m2: #B79AF0; --tj-m246: #A37DEE; --tj-m45: #E07BD0; --tj-m6: #FF6FA6;
    --tj-gh: #5FD08A; --tj-id: #8DBDB5; --tj-qq: #6CC2F2; --tj-sl: #66738D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1424; --surface: #141D31; --sunk: #1B2640; --ink: #E6EBF4; --ink-2: #A9B4C8; --ink-3: #6F7C94;
  --rule: #26324C; --cobalt: #7FA0FF; --cobalt-ink: #A9BFFF; --cobalt-soft: #1E2C52; --turq: #3CC2B4; --turq-soft: #123A3A;
  --tomato: #FF7F6B; --tomato-soft: #3E1F1E; --saffron: #E4B24E; --saffron-soft: #3A2E16; --hide: #222E4A;
  --scrim: rgba(3, 6, 14, .6); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --tj-m2: #B79AF0; --tj-m246: #A37DEE; --tj-m45: #E07BD0; --tj-m6: #FF6FA6;
  --tj-gh: #5FD08A; --tj-id: #8DBDB5; --tj-qq: #6CC2F2; --tj-sl: #66738D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; overflow-x: clip; font-family: var(--font-ui); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.ar { font-family: var(--font-ar); direction: rtl; }
.q { font-family: var(--font-q); direction: rtl; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------ app frame */
#app { min-height: 100vh; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
.view { max-width: 42rem; margin: 0 auto; padding-inline: 16px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  margin-inline: -16px; padding: 10px 16px 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.topbar.scrolled { border-bottom-color: var(--rule); }
.topbar h1 { font-size: 22px; line-height: 1.15; margin: 0; font-weight: 650; letter-spacing: -.01em; flex: 1; min-width: 0; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
/* surah switcher: a capsule with the surah number in an eight-pointed star */
.title-btn { flex: 0 1 auto; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 10px; text-align: start; border: 0; background: var(--sunk);
  padding: 4px 14px 4px 5px; margin-inline-start: -4px; border-radius: 17px; transition: background-color .15s; }
.title-btn:active { background: color-mix(in srgb, var(--sunk) 65%, var(--rule)); }
.title-btn .tt { display: flex; flex-direction: column; min-width: 0; line-height: 1.22; }
.title-btn .t1 { display: flex; align-items: center; gap: 3px; min-width: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.title-btn .t1 > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title-btn .t2 { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.title-btn svg.chev { width: 17px; height: 17px; color: var(--ink-3); stroke-width: 2.2; }
.grow-space { flex: 1 1 0; min-width: 0; }
.icon-btn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 0; background: none; color: var(--ink-2); }
.icon-btn:active, .icon-btn[aria-pressed="true"] { background: var(--sunk); color: var(--ink); }
.icon-btn svg, .tab svg, .btn svg { width: 22px; height: 22px; }
/* two squares, one turned by 45 degrees, like the rubʿ al-hizb sign */
.sbadge { --star: polygon(50% 0%, 64.64% 14.64%, 85.36% 14.64%, 85.36% 35.36%, 100% 50%, 85.36% 64.64%, 85.36% 85.36%, 64.64% 85.36%, 50% 100%, 35.36% 85.36%, 14.64% 85.36%, 14.64% 64.64%, 0% 50%, 14.64% 35.36%, 14.64% 14.64%, 35.36% 14.64%);
  position: relative; flex: none; width: 38px; height: 38px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--cobalt) 42%, var(--rule)); -webkit-clip-path: var(--star); clip-path: var(--star); }
.sbadge::before { content: ""; position: absolute; inset: 2.2px; background: var(--surface); -webkit-clip-path: var(--star); clip-path: var(--star); }
.sbadge b { position: relative; font-size: 12.5px; font-weight: 650; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.sbadge.on { background: var(--cobalt); }
.sbadge.on::before { display: none; }
.sbadge.on b { color: #fff; }
:root[data-theme="dark"] .sbadge.on b { color: #0B1430; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sbadge.on b { color: #0B1430; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: center; }
.tabbar-in { display: flex; width: 100%; max-width: 30rem; }
.tab { flex: 1; height: var(--tab-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 12px; font-weight: 600; position: relative; }
.tab[aria-selected="true"] { color: var(--cobalt); }
.tab .badge { position: absolute; top: 9px; inset-inline-start: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--turq); color: #fff; font-size: 11px; line-height: 17px; text-align: center; }

/* ------------------------------------------------------------ buttons, chips, controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 6px 18px; line-height: 1.2; text-align: center; border-radius: 13px; border: 1px solid var(--rule); background: var(--surface); font-weight: 600; font-size: 15px; color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0B1430; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0B1430; } }
.btn.ghost { background: none; border-color: transparent; color: var(--cobalt-ink); }
.btn.danger { color: var(--tomato); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 140px; min-width: 0; }
.seg { display: flex; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; height: 34px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 0 10px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 32, 51, .12); }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--rule); position: relative; flex: none; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch:checked { background: var(--turq); }
.switch:checked::after { transform: translateX(18px); }
input[type="range"] { width: 100%; accent-color: var(--cobalt); }
.field { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); padding: 0 14px; font-size: 16px; }
.field:focus { outline: 2px solid var(--cobalt); outline-offset: -1px; }
textarea.field { height: 110px; padding: 10px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; resize: vertical; }

/* ------------------------------------------------------------ reader */
.reader { padding-block: 6px 120px; }
.surah-head { margin: 22px 0 6px; display: grid; justify-items: center; gap: 4px; text-align: center; }
.cartouche { position: relative; width: 100%; max-width: 30rem; padding: 12px 18px 10px; border-block: 1px solid var(--cobalt); }
.cartouche::before, .cartouche::after { content: ""; position: absolute; top: 50%; width: 9px; height: 9px; background: var(--turq); transform: translateY(-50%) rotate(45deg); }
.cartouche::before { left: -5px; } .cartouche::after { right: -5px; }
.cartouche .inner { border-block: 1px solid color-mix(in srgb, var(--cobalt) 35%, transparent); padding: 6px 0 4px; }
.cartouche .name-ar { font-family: var(--font-ar); font-weight: 600; font-size: 28px; line-height: 1.5; color: var(--cobalt-ink); }
.cartouche .name-de { font-size: 15px; font-weight: 600; }
.surah-meta { font-size: 13px; color: var(--ink-2); }
.basmala { font-family: var(--font-q); font-size: calc(var(--q-size) * 1.02); text-align: center; margin: 14px 0 4px; line-height: 2; color: var(--ink); }
.page { position: relative; }
.flow { font-family: var(--font-q); font-size: var(--q-size); line-height: 2.15; direction: rtl; text-align: justify; text-align-last: center; margin: 0; word-spacing: .04em; overflow-wrap: break-word; }
.pagebreak { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; color: var(--ink-3); font-size: 12.5px; font-weight: 600; }
.pagebreak::before, .pagebreak::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.pagebreak .pn { display: inline-flex; align-items: center; gap: 8px; }
.pagebreak .juzflag { color: var(--turq); }
.w { border-radius: 7px; transition: color .25s, background-color .25s; cursor: pointer; }
.w:hover { background: var(--sunk); }
.an { font-family: var(--font-q); color: var(--cobalt); cursor: pointer; padding: 0 .06em; white-space: nowrap; }
.an.mem { color: var(--turq); }
.hz { color: var(--turq); font-size: .8em; padding-inline-end: .2em; }
.verse-block { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-block .flow { text-align: right; text-align-last: right; }
.verse-block .tr { direction: ltr; font-size: 15px; line-height: 1.55; color: var(--ink-2); margin: 6px 0 0; }
.verse-block .vref { font-size: 12px; color: var(--ink-3); font-weight: 600; margin-top: 6px; display: flex; gap: 10px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--cobalt-soft); } 100% { background: transparent; } }
.surah-nav { display: flex; justify-content: space-between; gap: 10px; margin: 26px 0 0; }
.surah-nav .btn { flex: 1; min-width: 0; }
.surah-nav .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tajweed */
.tj-m2 { color: var(--tj-m2); } .tj-m246 { color: var(--tj-m246); } .tj-m45 { color: var(--tj-m45); } .tj-m6 { color: var(--tj-m6); }
.tj-gh { color: var(--tj-gh); } .tj-id { color: var(--tj-id); } .tj-qq { color: var(--tj-qq); } .tj-sl { color: var(--tj-sl); }

/* recitation states */
.reciting .w { color: var(--ink-3); }
.reciting .w.s1, .reciting .w.s7, .reciting .w.tt { color: var(--ink); }
.reciting .w.s2, .reciting .w.s3, .reciting .w.s4, .reciting .w.s5, .reciting .w.s6 { color: var(--ink); }
.reciting.tajweed .w.s1 [class^="tj-"], .reciting.tajweed .w.tt [class^="tj-"] { color: inherit; }
.reciting .basmala { color: var(--ink-3); transition: color .25s; }
.reciting .basmala.heard { color: var(--ink); }
.marks .w.s2 { background-image: radial-gradient(circle, var(--ink-3) 1.2px, transparent 1.6px); background-size: 7px 4px; background-repeat: repeat-x; background-position: 0 92%; }
.marks .w.s3, .marks .w.s6 { background-color: var(--saffron-soft); box-shadow: inset 0 -2px 0 var(--saffron); }
.marks .w.s4, .marks .w.s5 { background-color: var(--tomato-soft); box-shadow: inset 0 -2px 0 var(--tomato); }
.marks .w.s7 { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--turq) 55%, transparent); }
.w.cur { box-shadow: 0 2px 0 var(--cobalt); color: var(--ink); }
/* memorising: what is not recited yet is simply not there. No boxes, no gaps that give away how long a word is.
   Recited words appear one after another; a caret marks where the text goes on. */
.hide .w:not(.v):not(.cur) { display: none; }
.hide .w.cur:not(.v) { display: inline-block; width: 2px; height: 1.25em; margin: 0 .12em; vertical-align: -.28em; overflow: hidden; color: transparent;
  background: var(--cobalt); border-radius: 1px; box-shadow: none; animation: caret 1.1s steps(1) infinite; }
.hide .w.cur:not(.v) * { color: transparent !important; }
@keyframes caret { 50% { opacity: 0; } }
.hide .w.cur.v { box-shadow: none; }
.hide .an:not(.done) { display: none; }
.hide .page.unseen { display: none; }
.hide .page.open > .pagebreak { display: none; }
.hide .flow { text-align-last: right; }
.hide .verse-block:not(.started) { display: none; }
.hide .verse-block:not(.done) .tr, .hide .verse-block:not(.done) .vref { display: none; }
.hide .verse-block:not(.done) { border-bottom-color: transparent; }
/* a word the app showed as a hint, and a word recited after that hint */
.reciting .w.hn { color: var(--saffron); background-color: var(--saffron-soft); }
.reciting .w.s8 { color: var(--ink); }
.marks .w.s8 { background-image: radial-gradient(circle, var(--saffron) 1.3px, transparent 1.7px); background-size: 7px 4px; background-repeat: repeat-x; background-position: 0 92%; }

/* ------------------------------------------------------------ recite button + bar */
.fab { position: fixed; z-index: 25; right: max(16px, calc(50% - 21rem + 16px)); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 14px);
  height: 52px; padding: 0 20px 0 16px; border-radius: 26px; border: 0; background: var(--cobalt); color: #fff; font-weight: 650; font-size: 15px;
  display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }
:root[data-theme="dark"] .fab { color: #0B1430; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fab { color: #0B1430; } }
.fab svg { width: 22px; height: 22px; }
.recbar { position: fixed; z-index: 26; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px 10px; pointer-events: none; }
.recbar-in { pointer-events: auto; width: 100%; max-width: 40rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; box-shadow: var(--shadow); padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px; }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); flex: none; position: relative; }
.recbar[data-state="listening"] .rec-dot { background: var(--tomato); }
.recbar[data-state="speech"] .rec-dot { background: var(--tomato); }
.recbar[data-state="speech"] .rec-dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--tomato); opacity: .5; animation: ping 1.1s ease-out infinite; }
@keyframes ping { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.4); opacity: 0; } }
.rec-info { flex: 1; min-width: 0; }
.rec-info .l1 { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-info .l2 { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-info .heard { font-family: var(--font-q); direction: ltr; text-align: right; text-overflow: clip; font-size: 15px; color: var(--ink-3); }
.rec-info .heard span { direction: rtl; unicode-bidi: isolate; }
.recbar .btn.stop { background: var(--ink); color: var(--paper); border-color: var(--ink); min-height: 42px; padding: 0 14px; }
.recbar.paused #rec-hide, .recbar.paused #rec-help { display: none; }
.recbar.paused #rec-stop span, .recbar.strict #rec-stop span { display: none; }
.recbar.paused #rec-stop, .recbar.strict #rec-stop { padding: 0 12px; }
.recbar-in.miss { animation: miss .5s ease-out; }
@keyframes miss { 0% { border-color: var(--tomato); transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-1px); } 100% { border-color: var(--rule); transform: none; } }
#rec-help { color: var(--saffron); }
/* attempts left: small dots, used ones filled */
.tries { display: inline-flex; gap: 4px; vertical-align: middle; margin-inline-end: 6px; }
.tries i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--tomato); }
.tries i.used { background: var(--tomato); }
/* the hint: a quiet card above the bar */
.rec-hint { pointer-events: auto; width: 100%; max-width: 40rem; display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 14px; border-radius: 18px;
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--saffron) 45%, var(--rule)); box-shadow: var(--shadow); animation: hint-in .25s ease-out; }
@keyframes hint-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.rec-hint .hi { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--saffron-soft); color: var(--saffron); }
.rec-hint .hi svg { width: 20px; height: 20px; }
.rec-hint .ht { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.4; font-weight: 600; }
.rec-hint .ht small { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.rec-hint .ht .q { display: block; font-size: 28px; line-height: 1.7; font-weight: 400; text-align: right; color: var(--saffron); }
.rec-hint .ht.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rec-hint .ht.row .q { display: inline; min-width: 0; overflow-wrap: anywhere; }
.rec-hint .hx { width: 36px; height: 36px; color: var(--ink-3); }
.rec-hint .hx svg { width: 18px; height: 18px; }

/* ------------------------------------------------------------ sheets */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); opacity: 0; transition: opacity .22s; }
.scrim.open { opacity: 1; }
